trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.8'
  azureServiceConnection: 'REPLACE_WITH_AZURE_SERVICE_CONNECTION'

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: Plan
        displayName: Format, validate, and plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Terraform init, validate, and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_USE_CLI=true
                terraform fmt -check -recursive
                terraform init
                terraform validate
                terraform plan -no-color -out=tfplan

          - publish: tfplan
            displayName: Publish Terraform plan
            artifact: terraform-plan

  - stage: Apply
    displayName: Terraform apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'IndividualCI'))
    jobs:
      - deployment: Apply
        displayName: Apply Terraform plan
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_USE_CLI=true
                      terraform init
                      terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
