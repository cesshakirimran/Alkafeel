trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.8'
  azureServiceConnection: 'cesshakirimran'

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: Plan
        displayName: Format, validate, and plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              mkdir -p "$HOME/bin"
              curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -oq terraform.zip -d "$HOME/bin"
              echo "##vso[task.prependpath]$HOME/bin"
              terraform version
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Terraform init, validate, and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_USE_CLI=true
                terraform fmt -check -recursive
                terraform init
                terraform validate
                terraform plan -no-color -out=tfplan

          - publish: tfplan
            displayName: Publish Terraform plan
            artifact: terraform-plan

  - stage: Approval
    displayName: Approve Terraform apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'IndividualCI'))
    jobs:
      - job: ManualApproval
        displayName: Manual approval
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: Review the Terraform plan artifact before approving the apply stage.
              onTimeout: reject

  - stage: Apply
    displayName: Terraform apply
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - job: Apply
        displayName: Apply Terraform plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              mkdir -p "$HOME/bin"
              curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -oq terraform.zip -d "$HOME/bin"
              echo "##vso[task.prependpath]$HOME/bin"
              terraform version
            displayName: Install Terraform

          - download: current
            artifact: terraform-plan

          - task: AzureCLI@2
            displayName: Terraform apply
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_USE_CLI=true
                terraform init
                terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
