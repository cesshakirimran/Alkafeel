trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.8'
  azureServiceConnection: 'Alkafeel'

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: Plan
        displayName: Format, validate, and plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              terraform_version="$(terraformVersion)"
              install_dir="$HOME/bin"
              mkdir -p "$install_dir"
              command -v curl
              command -v unzip
              curl --fail --silent --show-error --location --retry 3 \
                --output /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip"
              unzip -oq /tmp/terraform.zip -d "$install_dir"
              export PATH="$install_dir:$PATH"
              echo "##vso[task.prependpath]$install_dir"
              terraform version
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Terraform init, validate, and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_USE_CLI=true
                terraform fmt -check -recursive
                terraform init
                terraform validate
                terraform plan -no-color -out=tfplan

          - publish: tfplan
            displayName: Publish Terraform plan
            artifact: terraform-plan

  - stage: Approval
    displayName: Approve Terraform apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'IndividualCI'))
    jobs:
      - job: ManualApproval
        displayName: Manual approval
        pool: server
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 1440
            inputs:
              instructions: Review the Terraform plan artifact before approving the apply stage.
              onTimeout: reject

  - stage: Apply
    displayName: Terraform apply
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - job: Apply
        displayName: Apply Terraform plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              terraform_version="$(terraformVersion)"
              install_dir="$HOME/bin"
              mkdir -p "$install_dir"
              command -v curl
              command -v unzip
              curl --fail --silent --show-error --location --retry 3 \
                --output /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/${terraform_version}/terraform_${terraform_version}_linux_amd64.zip"
              unzip -oq /tmp/terraform.zip -d "$install_dir"
              export PATH="$install_dir:$PATH"
              echo "##vso[task.prependpath]$install_dir"
              terraform version
            displayName: Install Terraform

          - download: current
            artifact: terraform-plan

          - task: AzureCLI@2
            displayName: Terraform apply
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_USE_CLI=true
                terraform init
                terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
